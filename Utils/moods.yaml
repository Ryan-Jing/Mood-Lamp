# =============================================================================
# Mood definitions — the single source of truth for each mood's LED look.
#
# Edit this file, then regenerate the C header:
#     pip install pyyaml            # once
#     python3 Utils/generate_moods.py
# That (re)writes Firmware/include/moods.h — DO NOT edit that header by hand.
#
# Fields per mood:
#   id      : C enum name. IDLE/BLE/NO_WIFI are status indicators (never user-selectable);
#             keep them first. MOOD_<n> entries are the user-selectable moods.
#   name    : human label (becomes a comment in the generated header).
#   colours : 1 to MAX_MOOD_COLOURS entries of [R, G, B], each 0-255.
#   pattern : solid | blink | breath | alternate | fade | breath_alternate
#   period  : animation length in milliseconds. Meaning depends on the pattern:
#               solid            -> ignored (use 0)
#               blink            -> full on+off cycle (LED is on for the first half)
#               breath           -> full dim -> bright -> dim cycle
#               alternate        -> dwell time on each colour before hard-switching
#               fade             -> time to cross-fade between consecutive colours
#               breath_alternate -> one breath (dim->bright->dim) per colour, advancing to
#                                   the next colour each cycle
# =============================================================================

moods:
  # --- Status moods (not user-selectable) ---
  - id: IDLE
    name: Default
    colours: [[255, 200, 160]]                 # soft warm white — calm idle glow
    pattern: breath
    period: 6000

  - id: BLE
    name: BLE Provisioning
    colours: [[0, 245, 255]]                    # cyan — Bluetooth colour
    pattern: blink
    period: 1000

  - id: NO_WIFI
    name: No Wi-Fi
    colours: [[255, 90, 25]]                    # reddish orange — error / attention
    pattern: blink
    period: 500

  # --- User-selectable moods ---
  - id: MOOD_1
    name: Excited
    colours: [[255, 220, 0]]                    # bright yellow
    pattern: breath
    period: 1000                                 # fast breathing — excitement

  - id: MOOD_2
    name: Happy
    colours: [[255, 0, 0], [255, 110, 0], [255, 220, 0], [0, 200, 0],
              [0, 90, 255], [75, 0, 190], [200, 0, 255]]   # rainbow (7 colours)
    pattern: fade
    period: 1000                                 # fast transitions through the rainbow

  - id: MOOD_3
    name: Sad
    colours: [[0, 0, 100]]                      # darker blue
    pattern: breath
    period: 3000                                # slow, heavy breathing

  - id: MOOD_4
    name: Upset
    colours: [[130, 0, 0]]                       # dark red
    pattern: breath
    period: 1000                                # slow alternation

  - id: MOOD_5
    name: Anxious
    colours: [[40, 0, 60], [100, 0, 150], [180, 0, 255], [200, 0, 50]]  # dark purple -> red
    pattern: breath_alternate
    period: 800                                 # fast breathing through purplish colours

  - id: MOOD_6
    name: Deep Breaths
    colours: [[20, 80, 10]]                       # dark green
    pattern: breath
    period: 8000                                # long, deep breaths

  - id: MOOD_7
    name: Love
    colours: [[150, 0, 60], [255, 60, 120], [255, 0, 140], [200, 120, 255]]  # pinks -> light purple
    pattern: fade
    period: 1000

  - id: MOOD_8
    name: Heepy
    colours: [[255, 0, 150]]                    # bright pink
    pattern: blink
    period: 800

  - id: MOOD_9
    name: Hungry
    colours: [[110, 80, 0]]                     # dark dirty brownish yellow
    pattern: breath
    period: 1000

  - id: MOOD_10
    name: Tired
    colours: [[130, 0, 0], [150, 55, 0]]        # dark red <-> dark orange
    pattern: fade
    period: 10000

  - id: MOOD_11
    name: Working
    colours: [[240, 110, 0]]                    # warm orange
    pattern: solid
    period: 0
